version: '3'

info:
  companyName: "Pankaj Kumar"
  productName: "Mail Probe"
  productIdentifier: "com.wails.mail-probe"
  description: "SMTP Diagnostics Tool"
  copyright: "(c) 2024 Pankaj Kumar"
  comments: ""
  version: "1.0.0"

dev_mode:
  root_path: .
  log_level: warn
  debounce: 1000
  ignore:
    dir:
      - .git
      - node_modules
      - frontend
      - bin
    file:
      - .DS_Store
    watched_extension:
      - "*.go"
    git_ignore: true
  executes:
    - cmd: wails3 build DEV=true
      type: blocking
    - cmd: wails3 task common:dev:frontend
      type: background
    - cmd: wails3 task run
      type: primary
      exit_policy: shutdown

fileAssociations:
other:
